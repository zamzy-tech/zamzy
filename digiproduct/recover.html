<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Customer Access &amp; Order Lookup — ZAMZY Digital</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/digiproduct/assets/images/zamzy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/digiproduct/assets/css/design-system.css">
  <style>
    body {
      background: #07090e;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 0;
    }
    .recover-header {
      padding: 24px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(10, 13, 22, 0.8);
      backdrop-filter: blur(12px);
    }
    .recover-header a {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-decoration: none;
    }
    .recover-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .recover-card {
      background: #0f1422;
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.1);
    }
    .recover-card h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .recover-card p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      background: #181f33;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }
    .result-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      display: block;
    }
    .result-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      display: block;
    }
    .order-item-link {
      display: block;
      margin-top: 10px;
      padding: 10px 14px;
      background: #1e293b;
      border: 1px solid #4338ca;
      border-radius: 8px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    .order-item-link:hover {
      background: #312e81;
      border-color: #6366f1;
    }
    .recover-footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>
  <header class="recover-header">
    <a href="/digiproduct">ZAMZY <span>DIGITAL</span></a>
  </header>

  <div class="recover-container">
    <div class="recover-card">
      <h1>Access Your Purchases</h1>
      <p class="subtitle">Enter your registered email address or WhatsApp phone number to instantly retrieve and download your products.</p>
      
      <form onsubmit="return recoverAccess(event)">
        <div class="form-group">
          <label class="form-label" for="identifier">Email Address or Phone Number</label>
          <input type="text" class="form-input" id="identifier" required placeholder="name@email.com or 9876543210">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="orderNumber">Order # (Optional)</label>
          <input type="text" class="form-input" id="orderNumber" placeholder="ZM... (if available)">
        </div>

        <button type="submit" class="btn-submit" id="recoverBtn">⚡ ACCESS MY PRODUCTS</button>
      </form>

      <div id="result" class="result-box"></div>

      <p style="text-align:center; margin-top: 24px; font-size: 13px;">
        <a href="/digiproduct" style="color: #818cf8; text-decoration: none;">← Back to Digital Store</a>
      </p>
    </div>
  </div>

  <footer class="recover-footer">
    &copy; 2026 ZAMZY Technologies. Verified &amp; Encrypted Access Room.
  </footer>

  <script>
    async function recoverAccess(e) {
      e.preventDefault();
      const btn = document.getElementById('recoverBtn');
      const resultEl = document.getElementById('result');
      const idVal = document.getElementById('identifier').value.trim();
      const ordVal = document.getElementById('orderNumber').value.trim();

      btn.textContent = 'VERIFYING...';
      btn.disabled = true;
      resultEl.className = 'result-box';
      resultEl.style.display = 'none';

      let email = '';
      let phone = '';
      if (idVal.includes('@')) {
        email = idVal;
      } else {
        phone = idVal.replace(/[^0-9]/g, '');
      }

      try {
        const res = await fetch('/api/recovery/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            phone: phone,
            orderNumber: ordVal
          })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          let html = `<div style="font-weight:700; margin-bottom:8px;">✅ Access Unlocked for ${data.customerName || 'Customer'}!</div>`;
          if (data.orders && data.orders.length > 0) {
            html += `<div style="font-size:12px; color:#cbd5e1; margin-bottom:6px;">Your unlocked products:</div>`;
            data.orders.forEach(o => {
              html += `<a href="${o.accessUrl}" class="order-item-link" target="_blank">📥 ${o.productName} (Order #${o.orderNumber}) →</a>`;
            });
          } else if (data.accessUrl) {
            html += `<a href="${data.accessUrl}" class="order-item-link" target="_blank">📥 Access / Download Your Files →</a>`;
          }
          resultEl.innerHTML = html;
          resultEl.className = 'result-box result-success';
          resultEl.style.display = 'block';
        } else {
          resultEl.innerHTML = `❌ ${data.error || 'No active purchase found with this detail. Please check spelling.'}`;
          resultEl.className = 'result-box result-error';
          resultEl.style.display = 'block';
        }
      } catch (err) {
        resultEl.innerHTML = '❌ Network error. Please try again in a moment.';
        resultEl.className = 'result-box result-error';
        resultEl.style.display = 'block';
      }

      btn.textContent = '⚡ ACCESS MY PRODUCTS';
      btn.disabled = false;
    }
  </script>
</body>
</html>
