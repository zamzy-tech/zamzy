<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Checkout — ZAMZY Digital Products</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/digiproduct/assets/images/zamzy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/digiproduct/assets/css/design-system.css">
  <style>
    .page-header {
      background: rgba(5, 5, 5, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-glass);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .page-header-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header a {
      font-family: var(--font-display);
      color: var(--white);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .page-header span {
      font-family: var(--font-mono);
      color: var(--cyan);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .page-content {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 140px;
    }

    .checkout-card {
      background: var(--void-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      margin-bottom: 24px;
    }

    .checkout-section-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkout-section-title span.num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    /* Order Summary Box */
    .order-summary-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 24px;
    }
    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      font-size: 14px;
      color: var(--dim);
    }
    .order-item-name { font-weight: 600; color: var(--white); }
    .order-item-price { font-family: var(--font-display); font-weight: 700; color: var(--white); }
    .order-divider {
      height: 1px;
      background: var(--border-glass);
      margin: 12px 0;
    }
    .order-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      padding-top: 8px;
    }

    /* Addon Bump */
    .addon-bump {
      background: rgba(139, 92, 246, 0.08);
      border: 1px dashed rgba(139, 92, 246, 0.4);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 24px;
      transition: all var(--duration) var(--ease);
    }
    .addon-bump:hover {
      border-color: var(--cyan);
      background: rgba(6, 182, 212, 0.08);
    }
    .addon-bump-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    /* Coupon */
    .coupon-toggle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cyan);
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 16px;
      display: inline-block;
    }
    .coupon-form {
      display: none;
      gap: 10px;
      margin-bottom: 20px;
    }
    .coupon-form.visible { display: flex; }
    .coupon-result {
      font-size: 13px;
      margin-bottom: 16px;
    }
    .coupon-success { color: #6ee7b7; }
    .coupon-error { color: #fca5a5; }

    .sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: rgba(10, 10, 15, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(139, 92, 246, 0.35);
      padding: 14px 20px;
      padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
      z-index: 9999;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
    }
    .sticky-cta-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .sticky-price {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: var(--white);
    }
    .sticky-cta .btn {
      flex: 1;
      max-width: 340px;
    }

    @media (min-width: 768px) {
      .page-content { padding: 56px 40px 140px; }
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <div>
        <a href="/digiproduct">ZAMZY</a>
        <span>SECURE CHECKOUT</span>
      </div>
    </div>
  </header>

  <main class="page-content">
    <div class="eyebrow" style="margin-bottom: 8px;">FINAL STEP</div>
    <h1 class="heading-xl" style="margin-bottom: 8px;">Complete Purchase</h1>
    <p class="text-body" style="margin-bottom: 32px;">Instant digital delivery after payment.</p>

    <!-- Order Summary Card -->
    <div class="checkout-card">
      <div class="checkout-section-title">
        <span class="num">1</span> Order Summary
      </div>

      <div class="order-summary-box" id="orderSummary">
        <div style="text-align:center; padding: 20px;"><div class="spinner" style="margin:0 auto;"></div></div>
      </div>

      <!-- Addon Bump -->
      <div class="addon-bump" id="addonBump" style="display:none;">
        <span class="addon-bump-badge">RECOMMENDED ADD-ON</span>
        <label class="form-checkbox">
          <input type="checkbox" id="addonCheck" onchange="toggleAddon()">
          <div>
            <strong style="color: var(--white);" id="addonName">ADD-ON PRODUCT</strong>
            <p class="text-sm mt-sm" id="addonLabel">Add special addon for extra value</p>
          </div>
        </label>
      </div>

      <!-- Coupon Code -->
      <div class="coupon-toggle" onclick="toggleCoupon()">Have a discount coupon?</div>
      <div class="coupon-form" id="couponForm">
        <input type="text" class="form-input" id="couponInput" placeholder="Enter code (e.g. ZAMZY10)" style="text-transform: uppercase;">
        <button type="button" class="btn btn-secondary" onclick="applyCoupon()">Apply</button>
      </div>
      <div id="couponResult"></div>
    </div>

    <!-- Contact & Payment Details Card -->
    <div class="checkout-card">
      <div class="checkout-section-title">
        <span class="num">2</span> Delivery Information
      </div>

      <form id="checkoutForm" onsubmit="handleCheckout(event)">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" class="form-input" id="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address (For Product Access Link)</label>
          <input type="email" class="form-input" id="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">WhatsApp Phone Number</label>
          <input type="tel" class="form-input" id="phone" placeholder="10-digit mobile number" required pattern="[0-9]{10,12}">
        </div>

        <div class="form-group mt-lg">
          <label class="form-checkbox">
            <input type="checkbox" id="termsCheck" checked required>
            <span class="text-sm">I agree to the <a href="/digiproduct/terms.html" style="color: var(--cyan); text-decoration: underline;">Terms & Conditions</a> and <a href="/digiproduct/refund-policy.html" style="color: var(--cyan); text-decoration: underline;">Refund Policy</a>. Digital product download access is provided instantly upon payment verification.</span>
          </label>
        </div>

        <div class="form-group" style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary btn-block pay-btn-main" id="inlinePayBtn" disabled style="width:100%; font-size:16px; padding:16px;">
            PAY & ACCESS NOW →
          </button>
        </div>
      </form>
    </div>
  </main>

  <div class="sticky-cta">
    <div class="sticky-cta-inner">
      <div class="sticky-price" id="stickyTotal">₹249</div>
      <button type="button" class="btn btn-primary pay-btn-main" id="payBtn" onclick="handleCheckout()" disabled>PAY & ACCESS NOW →</button>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script>
    let mainProduct = null;
    let addonProduct = null;
    let addonSelected = false;
    let coupon = null;
    let isProcessing = false;
    let currentTotalAmount = 24900;

    const FALLBACK_PRODUCTS = [
      {
        id: 1,
        slug: 'usa-business-prospects',
        name: '5L+ USA Business Prospects Data',
        priceDisplay: '₹249',
        priceRaw: 24900,
        type: 'single'
      },
      {
        id: 2,
        slug: 'india-business-leads',
        name: 'India Business Leads Database',
        priceDisplay: '₹199',
        priceRaw: 19900,
        type: 'single'
      },
      {
        id: 3,
        slug: 'meta-ads-mastery',
        name: 'Meta Ads Mastery Playbook & Templates',
        priceDisplay: '₹49',
        priceRaw: 4900,
        type: 'single'
      }
    ];

    const FALLBACK_ADDON = {
      id: 3,
      slug: 'meta-ads-mastery',
      name: 'Meta Ads Mastery Playbook & Templates',
      priceDisplay: '₹49',
      priceRaw: 4900
    };

    function apiUrl(path) {
      const basePath = window.location.pathname.includes('/zamzy/') ? '/zamzy/digiproduct' : '/digiproduct';
      let target = path;
      if (target.startsWith('/zamzy/digiproduct')) {
        target = target.replace('/zamzy/digiproduct', '');
      } else if (target.startsWith('/digiproduct')) {
        target = target.replace('/digiproduct', '');
      }
      if (!target.startsWith('/')) target = '/' + target;
      return basePath + target;
    }


    async function init() {
      const params = new URLSearchParams(window.location.search);
      const productSlug = params.get('product') || 'usa-business-prospects';

      try {
        const res = await fetch(apiUrl('/api/products'));
        if (res.ok) {
          const data = await res.json();
          if (data && data.products) {
            mainProduct = data.products.find(p => p.slug === productSlug);
            addonProduct = data.addons?.[0] || null;
          }
        }
      } catch (err) {
        console.warn('API load failed, using fallback checkout items');
      }

      if (!mainProduct) {
        mainProduct = FALLBACK_PRODUCTS.find(p => p.slug === productSlug) || FALLBACK_PRODUCTS[0];
      }
      if (!addonProduct && mainProduct.slug !== 'meta-ads-mastery') {
        addonProduct = FALLBACK_ADDON;
      }

      renderOrderSummary();
      if (addonProduct && mainProduct.slug !== addonProduct.slug) {
        renderAddon();
      }
    }

    function renderOrderSummary() {
      const subtotal = mainProduct.priceRaw !== undefined ? mainProduct.priceRaw : mainProduct.price;
      const addonTotal = addonSelected && addonProduct ? (addonProduct.priceRaw !== undefined ? addonProduct.priceRaw : addonProduct.price) : 0;
      const discount = coupon ? coupon.discountAmount : 0;
      const total = Math.max(0, subtotal + addonTotal - discount);
      currentTotalAmount = total;
      const mainPriceDisplay = mainProduct.priceDisplay || `₹${(subtotal / 100).toFixed(0)}`;
      const addonPriceDisplay = addonProduct ? (addonProduct.priceDisplay || `₹${(addonTotal / 100).toFixed(0)}`) : '';

      let html = `
        <div class="order-item">
          <span class="order-item-name">${mainProduct.name}</span>
          <span class="order-item-price">${mainPriceDisplay}</span>
        </div>
      `;

      if (addonSelected && addonProduct) {
        html += `
          <div class="order-item">
            <span class="order-item-name">${addonProduct.name}</span>
            <span class="order-item-price">${addonPriceDisplay}</span>
          </div>
        `;
      }

      if (discount > 0) {
        html += `
          <div class="order-item" style="color: #6ee7b7;">
            <span class="order-item-name">Discount (${coupon.code})</span>
            <span class="order-item-price">-₹${(discount / 100).toFixed(0)}</span>
          </div>
        `;
      }

      html += `
        <div class="order-divider"></div>
        <div class="order-total">
          <span>TOTAL</span>
          <span>₹${(total / 100).toFixed(0)}</span>
        </div>
      `;

      document.getElementById('orderSummary').innerHTML = html;
      document.getElementById('stickyTotal').textContent = `₹${(total / 100).toFixed(0)}`;
      updatePayButtonsState(false, `PAY & ACCESS NOW (₹${(total / 100).toFixed(0)}) →`);
    }

    function updatePayButtonsState(disabled, labelHtml) {
      const btns = document.querySelectorAll('.pay-btn-main');
      btns.forEach(btn => {
        btn.disabled = disabled;
        if (labelHtml) btn.innerHTML = labelHtml;
      });
    }

    function renderAddon() {
      const bump = document.getElementById('addonBump');
      bump.style.display = 'block';
      const addonPriceDisplay = addonProduct.priceDisplay || `₹${((addonProduct.priceRaw || addonProduct.price) / 100).toFixed(0)}`;
      document.getElementById('addonName').textContent = addonProduct.name.toUpperCase();
      document.getElementById('addonLabel').textContent = `Add ${addonProduct.name} for just ${addonPriceDisplay}`;
    }

    function toggleAddon() {
      addonSelected = document.getElementById('addonCheck').checked;
      renderOrderSummary();
    }

    function toggleCoupon() {
      document.getElementById('couponForm').classList.toggle('visible');
    }

    async function applyCoupon() {
      const code = document.getElementById('couponInput').value.trim();
      if (!code) return;

      const subtotal = (mainProduct.priceRaw !== undefined ? mainProduct.priceRaw : mainProduct.price) + (addonSelected && addonProduct ? (addonProduct.priceRaw !== undefined ? addonProduct.priceRaw : addonProduct.price) : 0);

      try {
        const res = await fetch(apiUrl('/api/coupons/validate'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ couponCode: code, totalAmount: subtotal }),
        });
        const data = await res.json();

        if (res.ok && data.valid) {
          coupon = data;
          document.getElementById('couponResult').innerHTML =
            `<div class="coupon-result coupon-success">✓ ${data.discountDisplay} applied!</div>`;
          renderOrderSummary();
        } else {
          document.getElementById('couponResult').innerHTML =
            `<div class="coupon-result coupon-error">${data.error || 'Invalid coupon.'}</div>`;
        }
      } catch {
        document.getElementById('couponResult').innerHTML =
          '<div class="coupon-result coupon-error">Failed to validate coupon.</div>';
      }
    }

    async function handleCheckout(e) {
      if (e) e.preventDefault();
      if (isProcessing) return;

      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const terms = document.getElementById('termsCheck').checked;

      if (!name || !email || !phone) {
        showToast('Please fill in all required fields.', 'error');
        return;
      }

      if (!terms) {
        showToast('Please accept the Terms & Conditions.', 'error');
        return;
      }

      isProcessing = true;
      updatePayButtonsState(true, '<div class="spinner"></div> Processing...');

      try {
        const payload = {
          productId: mainProduct.id,
          productSlug: mainProduct.slug,
          addonProductId: addonSelected && addonProduct ? addonProduct.id : null,
          addons: addonSelected && addonProduct ? [addonProduct.slug] : [],
          couponCode: coupon ? coupon.code : null,
          customerName: name,
          customerEmail: email,
          customerPhone: phone,
          attribution: JSON.parse(sessionStorage.getItem('zamzy_attribution') || '{}'),
        };

        const res = await fetch(apiUrl('/api/checkout'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Checkout initiation failed.');
        }

        const isRazorpayValid = data.paymentMode === 'razorpay' && 
                                data.razorpayKeyId && 
                                data.razorpayKeyId.startsWith('rzp_') && 
                                data.razorpayKeyId !== 'rzp_test_default' && 
                                window.Razorpay;

        if (isRazorpayValid) {
          const options = {
            key: data.razorpayKeyId,
            amount: data.amount,
            currency: 'INR',
            name: 'ZAMZY Digital Products',
            description: mainProduct.name,
            prefill: { name, email, contact: phone },
            theme: { color: '#8B5CF6' },
            handler: async function(response) {
              window.location.href = apiUrl(`/payment-success?order_number=${data.orderNumber}&payment_id=${response.razorpay_payment_id || ''}&signature=${response.razorpay_signature || ''}`);
            },
            modal: {
              ondismiss: function() {
                isProcessing = false;
                updatePayButtonsState(false, `PAY & ACCESS NOW (₹${(currentTotalAmount / 100).toFixed(0)}) →`);
              }
            }
          };

          if (data.razorpayOrderId && !data.razorpayOrderId.startsWith('order_mock_')) {
            options.order_id = data.razorpayOrderId;
          }

          try {
            const rzp = new Razorpay(options);
            rzp.on('payment.failed', function (resp) {
              console.warn('Razorpay checkout attempt result', resp);
              showToast(resp.error?.description || 'Payment failed or cancelled.', 'error');
              isProcessing = false;
              updatePayButtonsState(false, `PAY & ACCESS NOW (₹${(currentTotalAmount / 100).toFixed(0)}) →`);
            });
            rzp.open();
          } catch(err) {
            console.error('Razorpay SDK modal error:', err);
            window.location.href = apiUrl(`/payment-success?order_number=${data.orderNumber}&mock_success=true`);
          }
        } else {
          // Direct fulfillment redirect fallback for test/mock mode
          window.location.href = apiUrl(`/payment-success?order_number=${data.orderNumber}&mock_success=true`);
        }


      } catch (err) {
        showToast(err.message || 'Payment processing failed. Please try again.', 'error');
        isProcessing = false;
        updatePayButtonsState(false, `PAY & ACCESS NOW (₹${(currentTotalAmount / 100).toFixed(0)}) →`);
      }
    }

    function showToast(msg, type = 'error') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    init();
  </script>
</body>
</html>
