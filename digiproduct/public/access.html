<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Purchase — ZAMZY Digital Products</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/images/zamzy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <style>
    .access-page { min-height: 100vh; background: var(--gray-50); }

    .access-header {
      background: var(--black);
      padding: 20px;
      text-align: center;
    }
    .access-header h1 {
      color: var(--white);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .access-header p {
      color: var(--violet);
      font-size: 10px;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .access-content {
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .access-greeting {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    .access-greeting h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .order-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--violet-50);
      border: 1px solid var(--violet-light);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }
    .status-paid {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #007700;
      margin-top: 8px;
    }

    .product-access-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .pac-info { flex: 1; }
    .pac-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      background: var(--violet-50);
      border: 1px solid var(--violet-light);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .pac-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .pac-meta {
      font-size: 12px;
      color: var(--gray-500);
    }
    .pac-btn {
      padding: 10px 20px;
      font-size: 13px;
      min-height: 40px;
    }
    .pac-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .access-support {
      text-align: center;
      margin-top: 32px;
      padding: 20px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
    }
    .access-support p {
      font-size: 13px;
      color: var(--gray-600);
      margin-bottom: 4px;
    }
    .access-support a {
      color: var(--violet-dark);
      font-weight: 600;
      text-decoration: underline;
    }

    .error-page {
      text-align: center;
      padding: 80px 20px;
    }
    .error-page h2 {
      margin-bottom: 12px;
    }

    @media (min-width: 768px) {
      .access-content { padding: 40px 40px 60px; }
    }
  </style>
</head>
<body>
  <div class="access-page">
    <header class="access-header">
      <h1>ZAMZY</h1>
      <p>DIGITAL PRODUCTS</p>
    </header>

    <main class="access-content" id="accessContent">
      <div style="text-align:center; padding: 60px 0;"><div class="spinner" style="margin: 0 auto;"></div><p class="text-sm mt-md">Loading your purchase...</p></div>
    </main>
  </div>

  <script>
    const token = window.location.pathname.split('/access/')[1];

    if (!token) {
      showError('This access link is invalid.');
    } else {
      loadAccess();
    }

    async function loadAccess() {
      try {
        const res = await fetch(`/api/access/${token}`);
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Access unavailable.');
          return;
        }

        renderAccess(data);
      } catch {
        showError('Failed to load your purchase. Please try again.');
      }
    }

    function renderAccess(data) {
      const icons = {
        'usa-business-prospects': '🇺🇸',
        'india-business-leads': '🇮🇳',
        'meta-ads-mastery': '📘',
      };

      const content = document.getElementById('accessContent');
      content.innerHTML = `
        <div class="access-greeting">
          <h2>Thank you, ${escapeHtml(data.customerName)}.</h2>
          <div class="order-badge">Order #${escapeHtml(data.orderNumber)}</div>
          <div class="status-paid">✓ Payment: PAID</div>
        </div>

        <p class="heading-sm" style="margin-bottom: 16px;">Your Products</p>

        ${data.products.map(product => `
          <div class="product-access-card" id="card-${product.id}">
            <div class="pac-icon">${icons[product.slug] || '📄'}</div>
            <div class="pac-info">
              <div class="pac-name">${escapeHtml(product.name)}</div>
              <div class="pac-meta">${product.canDownload ? `${product.downloadCount}/${product.maxDownloads} downloads used` : 'Download limit reached'}</div>
            </div>
            <button class="btn btn-primary pac-btn" onclick="download('${token}', ${product.id})" ${!product.canDownload ? 'disabled' : ''}>
              ${product.canDownload ? 'DOWNLOAD' : 'LIMIT'}
            </button>
          </div>
        `).join('')}

        <div class="access-support">
          <p>Need help with your purchase?</p>
          <a href="mailto:work@zamzy.in">work@zamzy.in</a> · <a href="tel:+917287060553">+91 7287060553</a>
        </div>
      `;
    }

    async function download(tokenHash, productId) {
      const btn = document.querySelector(`#card-${productId} .pac-btn`);
      btn.textContent = 'Loading...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/access/${tokenHash}/download/${productId}`, {
          method: 'POST',
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'Download failed.');
          btn.textContent = 'DOWNLOAD';
          btn.disabled = false;
          return;
        }

        if (data.downloadUrl) {
          window.open(data.downloadUrl, '_blank');
          // Update count
          const meta = document.querySelector(`#card-${productId} .pac-meta`);
          meta.textContent = `${data.downloadCount}/${data.maxDownloads} downloads used`;

          if (data.downloadCount >= data.maxDownloads) {
            btn.textContent = 'LIMIT';
            btn.disabled = true;
          } else {
            btn.textContent = 'DOWNLOAD';
            btn.disabled = false;
          }
        } else {
          alert(data.error || 'Download not available. Please contact support.');
          btn.textContent = 'DOWNLOAD';
          btn.disabled = false;
        }
      } catch {
        alert('Download failed. Please try again.');
        btn.textContent = 'DOWNLOAD';
        btn.disabled = false;
      }
    }

    function showError(message) {
      document.getElementById('accessContent').innerHTML = `
        <div class="error-page">
          <h2 class="heading-lg">${escapeHtml(message)}</h2>
          <p class="text-body mt-md">If you believe this is an error, please contact support.</p>
          <div class="access-support" style="margin-top: 24px;">
            <a href="mailto:work@zamzy.in">work@zamzy.in</a> · <a href="tel:+917287060553">+91 7287060553</a>
          </div>
          <a href="/digiproduct/recover" class="btn btn-secondary" style="margin-top: 20px;">Recover Your Order →</a>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
