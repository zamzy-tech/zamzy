<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Select Product — ZAMZY Digital Products</title>
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="/digiproduct/assets/images/zamzy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/digiproduct/assets/css/design-system.css">
  <style>
    .page-header {
      background: rgba(5, 5, 5, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-glass);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .page-header-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header a {
      font-family: var(--font-display);
      color: var(--white);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .page-header span {
      font-family: var(--font-mono);
      color: var(--cyan);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .page-content {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 140px;
    }

    .product-select-card {
      background: var(--void-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 16px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: all var(--duration) var(--ease);
      position: relative;
    }
    .product-select-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.2);
      transform: translateY(-2px);
    }
    .product-select-card.selected {
      border-color: var(--cyan);
      background: rgba(6, 182, 212, 0.1);
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
    }
    .product-select-card .radio {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-glass-bright);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--duration) var(--ease);
    }
    .product-select-card.selected .radio {
      border-color: var(--cyan);
      background: var(--cyan);
      color: var(--void);
    }
    .product-select-card.selected .radio::after {
      content: '✓';
      font-size: 13px;
      font-weight: 800;
    }
    .psc-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .psc-icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .psc-info { flex: 1; }
    .psc-info h3 {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px;
    }
    .psc-info p {
      font-size: 13px;
      color: var(--dim);
      line-height: 1.4;
    }
    .psc-price {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
    }
    .psc-badge {
      position: absolute;
      top: -10px;
      right: 20px;
    }

    /* Product Detail Box */
    .product-detail {
      margin-top: 28px;
      padding: 24px;
      background: var(--void-card);
      border: 1px solid var(--border-glass-bright);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(16px);
      display: none;
    }
    .product-detail.visible { display: block; }
    .product-detail h4 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 16px;
    }
    .detail-list { list-style: none; }
    .detail-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      font-size: 14px;
      color: var(--dim);
      border-bottom: 1px solid var(--border-glass);
    }
    .detail-list li:last-child { border-bottom: none; }
    .detail-list .label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cyan);
      min-width: 100px;
    }

    .sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(5, 5, 5, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-glass);
      padding: 14px 20px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.8);
    }
    .sticky-cta-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .sticky-price {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: var(--white);
    }
    .sticky-cta .btn {
      flex: 1;
      max-width: 320px;
    }

    @media (min-width: 768px) {
      .page-content { padding: 56px 40px 140px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <div>
        <a href="/digiproduct">ZAMZY</a>
        <span>SELECT PRODUCT</span>
      </div>
    </div>
  </header>

  <main class="page-content">
    <div class="eyebrow" style="margin-bottom: 8px;">DIGITAL CATALOG</div>
    <h1 class="heading-xl" style="margin-bottom: 8px;">Select Your Product</h1>
    <p class="text-body" style="margin-bottom: 32px;">Choose the digital resource package you need.</p>

    <div id="productsContainer">
      <div style="text-align:center; padding: 40px;"><div class="spinner" style="margin: 0 auto;"></div></div>
    </div>

    <div class="product-detail" id="productDetail"></div>
  </main>

  <div class="sticky-cta" id="stickyCta" style="display:none;">
    <div class="sticky-cta-inner">
      <div class="sticky-price" id="stickyPrice">₹249</div>
      <a href="#" class="btn btn-primary" id="continueBtn">CONTINUE TO CHECKOUT →</a>
    </div>
  </div>

  <script>
    let selectedProduct = null;
    let products = [];

    const FALLBACK_PRODUCTS = [
      {
        id: 1,
        slug: 'usa-business-prospects',
        name: '5L+ USA Business Prospects Data',
        description: 'Comprehensive database of verified USA business contacts and leads.',
        priceDisplay: '₹249',
        priceAmount: 24900,
        type: 'single'
      },
      {
        id: 2,
        slug: 'india-business-leads',
        name: 'India Business Leads Database',
        description: 'Targeted database of B2B business leads across key Indian industries.',
        priceDisplay: '₹199',
        priceAmount: 19900,
        type: 'single'
      },
      {
        id: 3,
        slug: 'meta-ads-mastery',
        name: 'Meta Ads Mastery Playbook & Templates',
        description: 'Step-by-step Meta Ads frameworks and high-converting ad copy templates.',
        priceDisplay: '₹49',
        priceAmount: 4900,
        type: 'single'
      }
    ];

    const icons = {
      'usa-business-prospects': '🇺🇸',
      'india-business-leads': '🇮🇳',
      'meta-ads-mastery': '🚀',
      'business-bundle': '📦',
    };

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        if (res.ok) {
          const data = await res.json();
          if (data && data.products && data.products.length > 0) {
            products = data.products;
          } else {
            products = FALLBACK_PRODUCTS;
          }
        } else {
          products = FALLBACK_PRODUCTS;
        }
      } catch (err) {
        console.warn('API fetch failed, using fallback product list');
        products = FALLBACK_PRODUCTS;
      }

      renderProducts();

      // Auto-select from URL
      const params = new URLSearchParams(window.location.search);
      const selectSlug = params.get('select') || 'usa-business-prospects';
      const product = products.find(p => p.slug === selectSlug) || products[0];
      if (product) selectProduct(product.slug);
    }

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      container.innerHTML = products.map(p => `
        <div class="product-select-card" id="psc-${p.slug}" onclick="selectProduct('${p.slug}')">
          ${p.type === 'bundle' ? '<div class="psc-badge"><span class="badge">BEST VALUE</span></div>' : ''}
          <div class="psc-header">
            <div class="psc-icon">${icons[p.slug] || '📄'}</div>
            <div class="psc-info">
              <h3>${p.name}</h3>
              <p>${p.description?.substring(0, 75) || ''}</p>
            </div>
            <div class="psc-price">${p.priceDisplay}</div>
            <div class="radio"></div>
          </div>
        </div>
      `).join('');
    }

    function selectProduct(slug) {
      selectedProduct = products.find(p => p.slug === slug);
      if (!selectedProduct) return;

      // Update selection UI
      document.querySelectorAll('.product-select-card').forEach(el => el.classList.remove('selected'));
      const cardEl = document.getElementById('psc-' + slug);
      if (cardEl) cardEl.classList.add('selected');

      // Show detail
      const detail = document.getElementById('productDetail');
      detail.classList.add('visible');
      detail.innerHTML = `
        <h4>${selectedProduct.name}</h4>
        <ul class="detail-list">
          <li><span class="label">Price</span><span>${selectedProduct.priceDisplay}</span></li>
          <li><span class="label">Type</span><span>Digital product</span></li>
          <li><span class="label">Format</span><span>Downloadable Resource Package</span></li>
          <li><span class="label">Delivery</span><span>Instant access via Email & WhatsApp</span></li>
        </ul>
      `;

      // Show sticky CTA
      document.getElementById('stickyCta').style.display = 'block';
      document.getElementById('stickyPrice').textContent = selectedProduct.priceDisplay;
      document.getElementById('continueBtn').href = '/digiproduct/checkout?product=' + slug;
    }

    loadProducts();
  </script>
</body>
</html>
