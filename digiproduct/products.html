<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Digital Products & Courses — ZAMZY Store</title>
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="/digiproduct/assets/images/zamzy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/digiproduct/assets/css/design-system.css">
  <style>
    :root {
      --bg-dark: #07070a;
      --card-bg: #0f0f17;
      --card-hover: #151522;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-violet: #8b5cf6;
      --accent-violet-light: #a78bfa;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
    }
    body {
      background-color: var(--bg-dark);
      color: #e4e4e7;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* Header Navbar */
    .catalog-nav {
      background: rgba(7, 7, 10, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }
    .catalog-nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .catalog-brand {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-decoration: none;
    }
    .catalog-brand-img {
      height: 28px;
      width: auto;
      display: block;
    }
    .catalog-brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      font-weight: 700;
      color: var(--accent-violet-light);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      line-height: 1;
      display: block;
      margin-top: 1px;
    }
    .catalog-nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .catalog-nav-links a {
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .catalog-nav-links a:hover { color: #fff; }

    /* Hero Section */
    .catalog-hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 32px;
      text-align: center;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: var(--accent-violet-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .catalog-hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 40px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    @media (min-width: 768px) {
      .catalog-hero h1 { font-size: 48px; }
    }
    .catalog-hero p {
      font-size: 16px;
      color: #a1a1aa;
      max-width: 600px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }

    /* Category Filter Tabs */
    .filter-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .filter-tab {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #a1a1aa;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-tab:hover, .filter-tab.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
      border-color: var(--accent-violet);
      color: #fff;
    }

    /* Products Grid */
    .products-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 100px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 28px;
    }

    /* Product Card */
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .product-card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: rgba(139, 92, 246, 0.4);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 92, 246, 0.15);
    }
    .product-card.bundle-card {
      border: 1px solid rgba(6, 182, 212, 0.4);
      background: linear-gradient(180deg, #10101c, #0d0d17);
    }

    .card-top {
      margin-bottom: 20px;
    }
    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-icon {
      font-size: 32px;
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .bundle-badge {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border-color: rgba(6, 182, 212, 0.3);
    }

    .card-rating {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 12px;
    }
    .card-rating .stars { color: #f59e0b; }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .card-title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }
    .card-title a:hover { color: var(--accent-cyan); }

    .card-desc {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .card-features {
      list-style: none;
      padding: 0;
      margin: 0 0 24px;
    }
    .card-features li {
      font-size: 12px;
      color: #d4d4d8;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-features li::before {
      content: '✓';
      color: var(--accent-emerald);
      font-weight: 800;
    }

    /* Card Footer & Action Buttons */
    .card-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 20px;
    }
    .price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-price {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }
    .card-price-old {
      font-size: 14px;
      color: #71717a;
      text-decoration: line-through;
      margin-left: 8px;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #9333ea, #7c3aed);
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.5);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <nav class="catalog-nav">
    <div class="catalog-nav-inner">
      <a href="/digiproduct" class="catalog-brand">
        <img src="/digiproduct/assets/images/zamzy-logo.png" alt="ZAMZY" class="catalog-brand-img">
        <span class="catalog-brand-tag">Digital Products</span>
      </a>
      <div class="catalog-nav-links">
        <a href="/digiproduct/access" style="color:var(--accent-cyan); font-weight:700;">⚡ Access Vault</a>
        <a href="/fullstack-webinar">Webinars</a>
        <a href="mailto:work@zamzy.in">Support</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="catalog-hero">
    <div class="hero-eyebrow">⚡ INSTANT DOWNLOAD & DRIVE ACCESS</div>
    <h1>Select Your Digital Product</h1>
    <p>Premium B2B Lead Databases, Automation Blueprints, and Courses with verified Google Drive access links.</p>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterCategory('all')">All Products</button>
      <button class="filter-tab" onclick="filterCategory('leads')">B2B Leads Databases</button>
      <button class="filter-tab" onclick="filterCategory('course')">Courses & Blueprints</button>
      <button class="filter-tab" onclick="filterCategory('bundle')">Bundles</button>
    </div>
  </section>

  <!-- Products Container -->
  <main class="products-container">
    <div class="products-grid" id="productsGrid">
      <div style="grid-column: 1 / -1; text-align:center; padding:60px 0;">
        <div class="spinner" style="margin: 0 auto 16px;"></div>
        <p style="color:#a1a1aa; font-size:14px;">Loading digital catalog...</p>
      </div>
    </div>
  </main>

  <script>
    let allProducts = [];
    let currentFilter = 'all';

    const DEFAULT_CATALOG = [
      {
        id: 1,
        slug: 'usa-business-prospects',
        name: '5L+ USA Business Prospects Data',
        description: 'Comprehensive database of verified USA business contacts, founders, CEOs, and key decision-makers.',
        priceDisplay: '₹249',
        priceOld: '₹996',
        category: 'leads',
        type: 'digital',
        icon: '🇺🇸',
        imageUrl: '/digiproduct/assets/images/usa-prospects-mockup.jpg',
        badge: '500,000+ LEADS',
        features: [
          'Direct Founder & CEO Work Emails',
          'Verified Cell & Phone Numbers',
          'CSV & XLSX Excel Master File Format',
          'Instant Google Drive Access Room'
        ]
      },
      {
        id: 2,
        slug: 'india-business-leads',
        name: 'India Business Leads Database',
        description: 'Targeted B2B business directory across key Indian metro cities, MSMEs, IT, and real estate sectors.',
        priceDisplay: '₹249',
        priceOld: '₹996',
        category: 'leads',
        type: 'digital',
        icon: '🇮🇳',
        imageUrl: '/digiproduct/assets/images/india-leads-mockup.jpg',
        badge: 'INDIAN B2B DIRECTORY',
        features: [
          'Active WhatsApp ISD Numbers',
          'Categorized by Industry & City',
          'Cleaned & Deliverable Email Lists',
          'Instant Email & WhatsApp Delivery'
        ]
      },
      {
        id: 3,
        slug: 'business-bundle',
        name: 'Complete Mega Growth Package & Database Bundle',
        description: 'Get USA Database + India Database + Meta Ads Mastery + 2 Free Bonuses (Business Templates & AI Income Kit).',
        priceDisplay: '₹449',
        priceOld: '₹1,796',
        category: 'bundle',
        type: 'bundle',
        icon: '📦',
        imageUrl: '/digiproduct/assets/images/mega-bundle-mockup.jpg',
        badge: 'BEST VALUE BUNDLE — ₹449',
        features: [
          'Full Access to USA + India Databases',
          'Meta Ads Mastery Video Guides & Copy Templates',
          'Free Bonus #1: Business Templates Pack',
          'Free Bonus #2: Digital Tools & AI Income Starter Kit'
        ]
      },
      {
        id: 4,
        slug: 'meta-ads-mastery',
        name: 'Meta Ads Mastery Playbook & Templates',
        description: 'Step-by-step Meta (FB & IG) Ads frameworks, ad copy templates, and high-ROAS scaling blueprints.',
        priceDisplay: '₹49',
        priceOld: '₹196',
        category: 'course',
        type: 'course',
        icon: '🚀',
        imageUrl: '/digiproduct/assets/images/meta-ads-mockup.jpg',
        badge: 'COURSE & TEMPLATES',
        features: [
          'Plug-and-Play Ad Copy Frameworks',
          'High Converting Audience Cheat Sheets',
          'Scaling & Campaign Setup Video Guides',
          'Instant Drive Folder Download'
        ]
      }
    ];

    function apiUrl(path) {
      if (path.startsWith('/digiproduct')) return path;
      return '/digiproduct' + (path.startsWith('/') ? path : '/' + path);
    }

    function getCatalogProductImg(p) {
      if (p && p.imageUrl && p.imageUrl.trim() !== '') return p.imageUrl;
      if (p && p.image_url && p.image_url.trim() !== '') return p.image_url;
      const slug = (p.slug || '').toLowerCase();
      if (slug.includes('mega') || slug.includes('bundle')) return '/digiproduct/assets/images/mega-bundle-mockup.jpg';
      if (slug.includes('meta') || slug.includes('ads')) return '/digiproduct/assets/images/meta-ads-mockup.jpg';
      if (slug.includes('india') || slug.includes('lead')) return '/digiproduct/assets/images/india-leads-mockup.jpg';
      if (slug.includes('usa') || slug.includes('prospect')) return '/digiproduct/assets/images/usa-prospects-mockup.jpg';
      return '/digiproduct/assets/images/mega-bundle-mockup.jpg';
    }

    async function loadCatalog() {
      try {
        const res = await fetch(apiUrl('/api/products'));
        if (res.ok) {
          const data = await res.json();
          const apiProducts = [...(data.products || []), ...(data.addons || [])];

          if (apiProducts.length > 0) {
            allProducts = apiProducts.map(p => {
              const def = DEFAULT_CATALOG.find(d => d.slug === p.slug) || {};
              return {
                id: p.id,
                slug: p.slug,
                name: p.name,
                description: p.description || def.description || '',
                priceDisplay: p.priceDisplay || ('₹' + (p.price / 100).toFixed(0)),
                priceOld: def.priceOld || '₹999',
                category: p.type === 'bundle' ? 'bundle' : (p.type === 'course' ? 'course' : 'leads'),
                type: p.type || 'digital',
                icon: def.icon || '📄',
                imageUrl: p.image_url || p.imageUrl || def.imageUrl,
                badge: def.badge || (p.type?.toUpperCase() || 'DIGITAL PRODUCT'),
                features: def.features || ['Verified Google Drive Access', 'Instant Delivery via Email & WhatsApp']
              };
            });
          } else {
            allProducts = DEFAULT_CATALOG;
          }
        } else {
          allProducts = DEFAULT_CATALOG;
        }
      } catch (err) {
        allProducts = DEFAULT_CATALOG;
      }

      renderGrid();
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('productsGrid');
      const filtered = currentFilter === 'all' 
        ? allProducts 
        : allProducts.filter(p => p.category === currentFilter || p.type === currentFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding:60px 0; color:#a1a1aa;">No products found in this category.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const isBundle = p.type === 'bundle';
        const detailLink = `/digiproduct/product.html?slug=${p.slug}`;
        const checkoutLink = `/digiproduct/checkout?product=${p.slug}`;
        const imgUrl = getCatalogProductImg(p);

        return `
          <div class="product-card ${isBundle ? 'bundle-card' : ''}">
            <div style="margin: -28px -28px 18px -28px; overflow: hidden; border-radius: 20px 20px 0 0; background: #080b12; border-bottom: 1px solid rgba(255,255,255,0.06);">
              <a href="${detailLink}" style="display:block; overflow:hidden;">
                <img src="${imgUrl}" alt="${p.name}" style="width: 100%; height: 170px; object-fit: cover; display: block; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'" onerror="this.src='/digiproduct/assets/images/mega-bundle-mockup.jpg'">
              </a>
            </div>
            <div class="card-top">
              <div class="card-header-row">
                <div class="card-icon">${p.icon}</div>
                <div class="card-badge ${isBundle ? 'bundle-badge' : ''}">${p.badge}</div>
              </div>

              <div class="card-rating">
                <span class="stars">★★★★★</span>
                <span style="font-weight:700; color:#fff;">4.9</span>
                <span>(480+ Reviews)</span>
              </div>

              <h3 class="card-title">
                <a href="${detailLink}">${p.name}</a>
              </h3>

              <p class="card-desc">${p.description}</p>

              <ul class="card-features">
                ${p.features.map(f => `<li>${f}</li>`).join('')}
              </ul>
            </div>

            <div class="card-footer">
              <div class="price-row">
                <div>
                  <span class="card-price">${p.priceDisplay}</span>
                  <span class="card-price-old">${p.priceOld}</span>
                </div>
                <span style="font-size:11px; font-weight:700; color:#10b981;">INSTANT ACCESS</span>
              </div>

              <div class="btn-group">
                <a href="${detailLink}" class="btn-secondary">
                  📖 View Details
                </a>
                <a href="${checkoutLink}" class="btn-primary">
                  ⚡ Buy Now
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadCatalog();
  </script>

  <!-- Floating AI Chatbot & Control Dock -->
  <script src="/digiproduct/assets/js/chatbot.js"></script>
</body>
</html>
