<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Select Product — ZAMZY Digital Products</title>
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="/digiproduct/assets/images/zamzy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/digiproduct/assets/css/design-system.css">
  <style>
    .page-header {
      background: var(--black);
      padding: 16px 20px;
    }
    .page-header-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header a { color: var(--white); font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    .page-header span { color: var(--violet); font-size: 10px; letter-spacing: 1px; }

    .page-content {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px 120px;
    }

    .product-select-card {
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all var(--duration-md) var(--ease);
      position: relative;
    }
    .product-select-card:hover { border-color: var(--violet); }
    .product-select-card.selected {
      border-color: var(--violet);
      background: var(--violet-50);
      box-shadow: var(--shadow-violet);
    }
    .product-select-card .radio {
      width: 22px;
      height: 22px;
      border: 2px solid var(--gray-300);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--duration) var(--ease);
    }
    .product-select-card.selected .radio {
      border-color: var(--violet-dark);
      background: var(--violet);
    }
    .product-select-card.selected .radio::after {
      content: '✓';
      font-size: 12px;
      font-weight: 700;
    }
    .psc-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .psc-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      background: var(--violet-50);
      border: 1px solid var(--violet-light);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .psc-info { flex: 1; }
    .psc-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .psc-info p { font-size: 13px; color: var(--gray-600); }
    .psc-price { font-size: 20px; font-weight: 800; }
    .psc-badge {
      position: absolute;
      top: -10px;
      right: 16px;
    }

    /* Product Detail */
    .product-detail {
      margin-top: 24px;
      padding: 20px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      display: none;
    }
    .product-detail.visible { display: block; }
    .product-detail h4 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .detail-list {
      list-style: none;
    }
    .detail-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      font-size: 14px;
      color: var(--gray-700);
      border-bottom: 1px solid var(--gray-100);
    }
    .detail-list li:last-child { border-bottom: none; }
    .detail-list .label { font-weight: 600; color: var(--black); min-width: 100px; }

    .sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 1px solid var(--gray-200);
      padding: 12px 20px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
    }
    .sticky-cta-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .sticky-price {
      font-size: 22px;
      font-weight: 800;
    }
    .sticky-cta .btn {
      flex: 1;
      max-width: 280px;
    }

    @media (min-width: 768px) {
      .page-content { padding: 48px 40px 120px; }
      .sticky-cta { display: flex; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <div>
        <a href="/digiproduct">ZAMZY</a>
        <span>SELECT YOUR PRODUCT</span>
      </div>
    </div>
  </header>

  <main class="page-content">
    <h1 class="heading-lg" style="margin-bottom: 8px;">Select Your Product</h1>
    <p class="text-body" style="margin-bottom: 24px;">Choose the digital resource you need.</p>

    <div id="productsContainer">
      <div style="text-align:center; padding: 40px;"><div class="spinner" style="margin: 0 auto;"></div></div>
    </div>

    <div class="product-detail" id="productDetail"></div>
  </main>

  <div class="sticky-cta" id="stickyCta" style="display:none;">
    <div class="sticky-cta-inner">
      <div class="sticky-price" id="stickyPrice">₹249</div>
      <a href="#" class="btn btn-primary" id="continueBtn">CONTINUE TO CHECKOUT →</a>
    </div>
  </div>

  <script>
    let selectedProduct = null;
    let products = [];

    const icons = {
      'usa-business-prospects': '🇺🇸',
      'india-business-leads': '🇮🇳',
      'business-bundle': '📦',
    };

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        products = data.products;
        renderProducts();

        // Auto-select from URL
        const params = new URLSearchParams(window.location.search);
        const selectSlug = params.get('select');
        if (selectSlug) {
          const product = products.find(p => p.slug === selectSlug);
          if (product) selectProduct(product.slug);
        }
      } catch (err) {
        document.getElementById('productsContainer').innerHTML =
          '<p class="text-body" style="text-align:center; color: #cc0000;">Failed to load products. Please refresh.</p>';
      }
    }

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      container.innerHTML = products.map(p => `
        <div class="product-select-card" id="psc-${p.slug}" onclick="selectProduct('${p.slug}')">
          ${p.type === 'bundle' ? '<div class="psc-badge"><span class="badge">BEST VALUE</span></div>' : ''}
          <div class="psc-header">
            <div class="psc-icon">${icons[p.slug] || '📄'}</div>
            <div class="psc-info">
              <h3>${p.name}</h3>
              <p>${p.type === 'bundle' ? 'USA + India' : p.description?.substring(0, 60) || ''}</p>
            </div>
            <div class="psc-price">${p.priceDisplay}</div>
            <div class="radio"></div>
          </div>
        </div>
      `).join('');
    }

    function selectProduct(slug) {
      selectedProduct = products.find(p => p.slug === slug);
      if (!selectedProduct) return;

      // Update selection UI
      document.querySelectorAll('.product-select-card').forEach(el => el.classList.remove('selected'));
      document.getElementById('psc-' + slug).classList.add('selected');

      // Show detail
      const detail = document.getElementById('productDetail');
      detail.classList.add('visible');
      detail.innerHTML = `
        <h4>${selectedProduct.name}</h4>
        <ul class="detail-list">
          <li><span class="label">Price</span><span>${selectedProduct.priceDisplay}</span></li>
          <li><span class="label">Type</span><span>${selectedProduct.type === 'bundle' ? 'Bundle (multiple products)' : 'Digital product'}</span></li>
          <li><span class="label">Format</span><span>Downloadable file</span></li>
          <li><span class="label">Delivery</span><span>Secure access link via email & WhatsApp</span></li>
          ${selectedProduct.bundleItems ? `<li><span class="label">Includes</span><span>${selectedProduct.bundleItems.map(b => b.name).join(', ')}</span></li>` : ''}
        </ul>
      `;

      // Show sticky CTA
      document.getElementById('stickyCta').style.display = 'block';
      document.getElementById('stickyPrice').textContent = selectedProduct.priceDisplay;
      document.getElementById('continueBtn').href = '/digiproduct/checkout?product=' + slug;

      // Analytics
      fetch('/api/analytics/event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          eventType: 'ViewContent',
          productId: selectedProduct.id,
          page: '/digiproduct/products',
          sessionId: sessionStorage.getItem('zamzy_session'),
          attribution: JSON.parse(sessionStorage.getItem('zamzy_attribution') || '{}'),
        }),
      }).catch(() => {});
    }

    loadProducts();
  </script>
</body>
</html>
